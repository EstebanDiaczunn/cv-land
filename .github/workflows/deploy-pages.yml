name: Deploy preview to GitHub Pages

# Preview throwaway. La fuente de verdad de prod es el VPS propio (Fase 5).
# Esto sirve mientras no haya dominio comprado, para que el dueno (y
# eventuales lectores del CV) vean el sitio en vivo.
#
# URL final: https://estebandiaczunn.github.io/cv-land/
# Activacion manual: Settings -> Pages -> Source: GitHub Actions.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Evita concurrentes; no cancela un deploy en curso para no dejar el
# sitio en estado intermedio.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (with GH Pages base path)
        env:
          SITE_URL: https://estebandiaczunn.github.io
          BASE_PATH: /cv-land
        run: pnpm build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
