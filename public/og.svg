<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!--
    NERV-style Open Graph card · 1200×630
    Source artifact for /og.png. Re-rasterize with `node scripts/build-og.mjs`.
    Fonts use generic CSS families because libvips/librsvg renders this with
    fontconfig system fonts. On Linux that resolves to DejaVu Sans / Mono,
    which are geometric enough to read close to the on-site Oswald/Inter.
    Static design — no animation, no gradients beyond the amber accent line.
  -->
  <defs>
    <pattern id="hex-bg" patternUnits="userSpaceOnUse" width="60" height="52">
      <polygon points="30,1 58,15 58,37 30,51 2,37 2,15"
               fill="none" stroke="#ff6600" stroke-width="1" opacity="0.05"/>
    </pattern>
    <pattern id="hex-bg-2" patternUnits="userSpaceOnUse" width="60" height="52" x="30" y="26">
      <polygon points="30,1 58,15 58,37 30,51 2,37 2,15"
               fill="none" stroke="#ff6600" stroke-width="1" opacity="0.05"/>
    </pattern>
  </defs>

  <!-- Void background + honeycomb fill -->
  <rect width="1200" height="630" fill="#0a0a0a"/>
  <rect width="1200" height="630" fill="url(#hex-bg)"/>
  <rect width="1200" height="630" fill="url(#hex-bg-2)"/>

  <!-- Subtle vignette so social previews don't have flat black edges -->
  <radialGradient id="vig" cx="50%" cy="50%" r="70%">
    <stop offset="60%" stop-color="#000" stop-opacity="0"/>
    <stop offset="100%" stop-color="#000" stop-opacity="0.55"/>
  </radialGradient>
  <rect width="1200" height="630" fill="url(#vig)"/>

  <!-- Top status bar chrome -->
  <rect x="0" y="0" width="1200" height="44" fill="#141414"/>
  <rect x="0" y="44" width="1200" height="1" fill="#2a2a2a"/>
  <g font-family="DejaVu Sans Mono, monospace" font-size="14" letter-spacing="2">
    <circle cx="48" cy="22" r="3.5" fill="#00ff88"/>
    <text x="62" y="27" fill="#00ff88">STATUS: ONLINE</text>
    <text x="220" y="27" fill="#3d3d3d">·</text>
    <text x="240" y="27" fill="#a8a8a8" font-weight="bold">NERV SYSTEMS</text>
    <text x="395" y="27" fill="#3d3d3d">·</text>
    <text x="415" y="27" fill="#6e6e6e">35.6762N 139.6503E</text>
    <text x="1100" y="27" fill="#ff8800" text-anchor="end">CLEARANCE: TIER 3</text>
  </g>

  <!-- Corner brackets, NERV chrome at the safe-area edges -->
  <g stroke="#ff6600" stroke-width="2" fill="none">
    <!-- TL -->
    <path d="M60 100 L60 80 L80 80"/>
    <!-- TR -->
    <path d="M1140 100 L1140 80 L1120 80"/>
    <!-- BL -->
    <path d="M60 530 L60 550 L80 550"/>
    <!-- BR -->
    <path d="M1140 530 L1140 550 L1120 550"/>
  </g>

  <!-- Section eyebrow: "[ OPERATIVE PROFILE ]" -->
  <g font-family="DejaVu Sans Mono, monospace" font-size="20" letter-spacing="6">
    <text x="100" y="160" fill="#3d3d3d">[</text>
    <text x="125" y="160" fill="#ff6600">OPERATIVE  PROFILE</text>
    <text x="475" y="160" fill="#3d3d3d">]</text>
  </g>

  <!-- HERO NAME: "ESTEBAN DIACZUNN" — bold sans, all caps. Sized to fit the
       safe column (x=100..900) so the right-side glyph never collides. -->
  <text x="100" y="290"
        font-family="DejaVu Sans Condensed, DejaVu Sans, sans-serif"
        font-weight="bold"
        font-size="78"
        letter-spacing="2"
        fill="#f5f5f5"
        textLength="780"
        lengthAdjust="spacingAndGlyphs">ESTEBAN DIACZUNN</text>

  <!-- Codename row: "CODENAME :: NAIKI" -->
  <g font-family="DejaVu Sans Mono, monospace" font-size="32" letter-spacing="6">
    <text x="100" y="360" fill="#6e6e6e" font-size="20">CODENAME</text>
    <text x="245" y="360" fill="#ff6600" font-weight="bold" font-size="24">::</text>
    <text x="285" y="360" fill="#ff6600" font-weight="bold" letter-spacing="10">NAIKI</text>
  </g>

  <!-- Title / role line -->
  <text x="100" y="420"
        font-family="DejaVu Sans, sans-serif"
        font-size="26"
        fill="#a8a8a8">Backend Developer / Software Architect-in-training</text>

  <!-- Amber accent rule -->
  <line x1="100" y1="460" x2="320" y2="460" stroke="#ff6600" stroke-width="2"/>

  <!-- Meta strip at the bottom -->
  <g font-family="DejaVu Sans Mono, monospace" font-size="16" letter-spacing="3">
    <text x="100" y="500" fill="#6e6e6e">STATUS</text>
    <text x="200" y="500" fill="#00ff88" font-weight="bold">ACTIVE</text>
    <text x="295" y="500" fill="#3d3d3d">·</text>
    <text x="320" y="500" fill="#6e6e6e">LOCATION</text>
    <text x="430" y="500" fill="#f5f5f5">BUENOS AIRES, AR</text>
    <text x="660" y="500" fill="#3d3d3d">·</text>
    <text x="685" y="500" fill="#6e6e6e">CHANNEL</text>
    <text x="780" y="500" fill="#ff8800">cv-land</text>
  </g>

  <!--
    Right-side glyph: NERV-flavoured monogram with hex frame and angular N.
    Pure geometry, no font dependency. Mirrors the favicon at much larger
    scale so social previews carry the same visual mark.
  -->
  <g transform="translate(975 215) scale(6.2)" stroke="#ff6600" fill="none" stroke-linejoin="miter">
    <polygon points="16,3 28,10 28,22 16,29 4,22 4,10" stroke-width="0.45"/>
    <polygon points="16,8 23.5,12.5 23.5,19.5 16,24 8.5,19.5 8.5,12.5"
             stroke-width="0.25" opacity="0.45"/>
    <path d="M11 11 L11 21 M11 11 L21 21 M21 11 L21 21"
          stroke-width="0.5" stroke-linecap="square"/>
  </g>

  <!-- Subtle scan-line overlay across the hero block, very low intensity -->
  <pattern id="scan" patternUnits="userSpaceOnUse" width="1" height="3">
    <rect width="1" height="2" fill="#ff6600" opacity="0.025"/>
  </pattern>
  <rect x="0" y="80" width="1200" height="480" fill="url(#scan)"/>

  <!-- Bottom chrome: footer label -->
  <rect x="0" y="600" width="1200" height="1" fill="#2a2a2a"/>
  <g font-family="DejaVu Sans Mono, monospace" font-size="14" letter-spacing="3">
    <text x="100" y="620" fill="#6e6e6e">END OF TRANSMISSION</text>
    <text x="1100" y="620" fill="#6e6e6e" text-anchor="end">NERV / cv-land</text>
  </g>
</svg>
